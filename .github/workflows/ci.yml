name: CI

on:
  pull_request:
  push:
    branches: [v2, v3, v4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-build:
    name: astro check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install rather than npm ci until package-lock.json has been
      # regenerated for the Astro dependency set. Switch back to npm ci then.
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  lighthouse:
    name: Lighthouse CI budgets
    needs: check-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npm run lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7

  a11y:
    name: Playwright and axe at 390, 820, 1440
    needs: check-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Hosted Ubuntu runners already provide Chrome. Fail closed if absent.
      # Never disable the sandbox to make CI pass.
      - name: Verify installed Chrome
        run: google-chrome --version
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  links:
    name: lychee link check
    needs: check-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: lycheeverse/lychee-action@v2
        with:
          # Mail links are skipped by default in current lychee (--exclude-mail no longer exists).
          # LinkedIn answers bots with 999. Spotify and GitHub sometimes
          # rate-limit (429) or deny bots (403); treat those as reachable.
          # GitHub's blob pages answer 503 for stretches of time (seen on
          # the thaw receipt links, 2026-10-10, while the files were fine);
          # check a blob link against the raw file instead, which says
          # whether the file exists without the HTML view in between. The
          # links on the site stay the blob pages.
          # Same-origin absolute URLs (canonical, og:url) are verified
          # against the built site, not production: a route that exists only
          # in this PR is not live yet, so production answers 404. Remaps
          # are first-match-wins, so the tell-data rule comes first: that
          # path is deployed by the separate tell-data repo and is not in
          # this build, so it keeps being checked against production.
          args: >-
            --no-progress
            --accept 200..=206,403,429
            --exclude 'linkedin\.com'
            --remap 'https://karankapur\.com/tell-data/(.*) https://karankapur.com/tell-data/$1'
            --remap 'https://github.com/([^/]+/[^/]+)/blob/(.+) https://raw.githubusercontent.com/$1/$2'
            --remap 'https://karankapur\.com/(.*) file://${{ github.workspace }}/dist/$1'
            --root-dir dist
            'dist/**/*.html'
          fail: true
